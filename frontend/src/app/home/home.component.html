<div *ngIf="loading; else loadedTemplate">
    <app-loading></app-loading>
</div>
<ng-template #loadedTemplate>
<div class="grid nested-grid h-5rem zookeeper-header">
    <div class="col"></div>
    <div class="flex col align-items-center">
        <div class="grid ">
            <div class="flex col-3 justify-content-center align-items-center h-6rem">
                <img src="assets/zookeeper_logo.png" height="100px" alt="Logo" style="position: absolute;">
            </div>
            <div class="flex col justify-content-center align-items-center w-30rem h-6rem">
                <span class="title" style="color: white;">Zookeeper users management</span>
            </div>
        </div>
    </div>
    <div class="flex col justify-content-end align-items-center h-5rem mr-2 mt-1">

        <div class="flex row">
            <!-- Profile Picture -->
            <div class="p-mr-2">
                <img
                  src="assets/profile.jpg"
                  alt="profile picture"
                  class="profile-pic"
                />
              </div>
        </div>
        <div class="p-d-flex p-ai-center">
            <!-- Profile Text & Logout -->
            <div>
                    
              <span class="pl-3" style="font-weight: bold; cursor: default; color: #2e3237; text-decoration: underline;">{{ backendUrl }}</span><br>
              <p-button label="Logout" [link]="true" icon="pi pi-sign-out" styleClass="logoutButton" iconPos="right" (onClick)="logout()"/>
            </div>
          </div>
    </div>
</div>
  

<div class="grid grid-nogutter">
    <div class="col-fixed bg-dark" style="height: 100vh; width: 20%;">
        <app-node-tree [zNodes]="zNodes"></app-node-tree>
    </div>
    <div class="col">
        <div class="text-center">
            <app-nodes-visual [allNodes]="personNodes" (allNodesChange)="onAllNodesChange($event)"></app-nodes-visual>
        </div>
        <div class="flex align-items-center justify-content-center mt-3">
            <app-chat [userNodes]="personNodes"></app-chat>
        </div>
    </div>
</div>
</ng-template>
